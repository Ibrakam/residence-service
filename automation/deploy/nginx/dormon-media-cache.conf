# Include before the general residence project regex. A full image request
# and every conditional request pass the same private session check.
# JSON, pages, live catalogues and all other projects retain no-store.
location ~ ^/dormon-hills/(?:editorial|facades|media|showroom)/[a-z0-9][a-z0-9_-]*\.(?:webp|avif)$ {
    include /etc/nginx/snippets/tencorp-auth-protect-dormon-media.conf;
    if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }

    proxy_pass http://127.0.0.1:4320;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # No rewrite-phase 304/return: authorization must run first. Conditional
    # request headers reach Vinext, which validates the actual file metadata.
}
