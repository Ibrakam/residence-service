# Reviewed October audit remediation. Included inside the existing TLS server.
# Replaces the old static Avalon locations; preserves all login boundaries.
location = /avalon {
    include /etc/nginx/snippets/tencorp-auth-protect-page.conf;
    if ($request_method !~ ^(?:GET|HEAD|OPTIONS)$) { return 405; }
    proxy_pass http://127.0.0.1:4320;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
}

# Keep already-open legacy tabs functional during the release transition.
location ^~ /avalon/_next/static/ {
    include /etc/nginx/snippets/tencorp-auth-protect-api.conf;
    root /var/www/avalon-residence/current/dist/client;
    try_files $uri =404;
}

location ^~ /avalon/ {
    include /etc/nginx/snippets/tencorp-auth-protect-page.conf;
    if ($request_method !~ ^(?:GET|HEAD|OPTIONS)$) { return 405; }
    proxy_pass http://127.0.0.1:4320;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
}

location = /avalon-assets { return 404; }
location ^~ /avalon-assets/ {
    include /etc/nginx/snippets/tencorp-auth-protect-api.conf;
    alias /var/www/residence-service/root-current/frontend/dist/client/;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# Only the public homepage's generic enquiry is exempt. /v1/leads,
# /api/submit and every catalogue remain authenticated. The application
# validates same-origin JSON, four bounded fields, consent and CRM receipt.
location = /v1/agency-leads {
    include /etc/nginx/snippets/tencorp-auth-exempt.conf;
    if ($request_method != POST) { return 405; }
    client_max_body_size 4k;
    limit_req zone=residence_leads_per_ip burst=3 nodelay;
    limit_req_status 429;
    limit_conn residence_lead_connections 2;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4320;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
}
location ^~ /v1/agency-leads/ { return 404; }
