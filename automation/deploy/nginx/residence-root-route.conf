# The agency homepage is public, while every residence and catalogue remains
# protected by the server-level browser gate. Only the homepage's reviewed
# static prefixes are exempt. The map data module is explicitly re-protected:
# the public loader calls /__auth/me and requests it only for a valid session.
location = / {
    include /etc/nginx/snippets/tencorp-auth-exempt.conf;
    root /var/www/tencorp-preview/current;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# The project names, links and coordinates live in this module. Keep it behind
# the session check even though the surrounding homepage assets are public.
location = /tencorp/assets/projects-map.js {
    include /etc/nginx/snippets/tencorp-auth-protect-api.conf;
    alias /var/www/tencorp-preview/current/assets/projects-map.js;
    default_type application/javascript;
}

location ^~ /tencorp/assets/ {
    include /etc/nginx/snippets/tencorp-auth-exempt.conf;
    alias /var/www/tencorp-preview/current/assets/;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

location ^~ /tencorp/fonts/ {
    include /etc/nginx/snippets/tencorp-auth-exempt.conf;
    alias /var/www/tencorp-preview/current/fonts/;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

location ^~ /tencorp/images/ {
    include /etc/nginx/snippets/tencorp-auth-exempt.conf;
    alias /var/www/tencorp-preview/current/images/;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}
