# Dedicated proxy body for the fixed, versioned authorization artwork/fonts.
# The gateway owns Content-Type, ETag and the public immutable cache policy.
auth_request off;
proxy_pass http://127.0.0.1:4340;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Original-URI "";
proxy_set_header X-Auth-User-ID "";
proxy_set_header X-Auth-Telegram-ID "";
proxy_set_header X-Auth-Phone "";

proxy_pass_request_body off;
proxy_set_header Content-Length "";
proxy_connect_timeout 2s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_buffering on;
proxy_intercept_errors off;
proxy_hide_header Set-Cookie;

access_log off;
error_log /dev/null emerg;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
