# Include inside the few locations that must remain outside the shared browser
# gate. This is defense in depth if auth_request is ever added at server scope.
auth_request off;

# Exempt means "use another authentication boundary", not "forward the shared
# browser credential". Keep the HttpOnly session and client-supplied identity
# headers out of every exempt upstream. Locations whose independent contract
# uses Authorization (ticket-worker Bearer or analytics Basic) may still pass
# that header explicitly in their own block.
proxy_set_header Cookie "";
proxy_set_header X-Auth-User-ID "";
proxy_set_header X-Auth-Telegram-ID "";
proxy_set_header X-Auth-Phone "";
proxy_hide_header Set-Cookie;
