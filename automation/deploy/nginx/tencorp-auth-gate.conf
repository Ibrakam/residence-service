# Include once inside the TLS server block only at the reviewed public-gate
# cutover, after the auth routes are live and a real OIDC smoke session exists.
# Every ordinary content location then inherits this fail-closed check unless
# it explicitly includes tencorp-auth-exempt.conf. Page/API snippets select the
# appropriate 401 presentation; this server-level directive is the default
# security boundary for newly added or otherwise unclassified locations.
auth_request /__tencorp-auth/check;
satisfy all;
