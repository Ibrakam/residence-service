# Include once inside the TLS server block for form.tencorp.uz before enabling
# the public gate. This snippet exposes only the public OIDC routes and defines
# the internal check/login helpers. It deliberately does not install a
# server-level auth_request, so a real OIDC session can be obtained while the
# existing sites remain open. Enable the separate tencorp-auth-gate.conf only
# during the reviewed cutover.

# Public auth routes keep their URI when proxied. The gateway itself restricts
# the supported method/path pairs. Logging is disabled by the shared proxy
# snippet because callback and transaction URLs contain short-lived
# credentials and personal state.
location = /__auth {
    auth_request off;
    return 308 /__auth/login;
}

location = /__auth/login {
    limit_req zone=tencorp_auth_login_per_ip burst=60 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/tencorp-auth-public-proxy.conf;
}

location = /__auth/telegram/start {
    limit_req zone=tencorp_auth_start_per_ip burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/tencorp-auth-public-proxy.conf;
}

location = /__auth/telegram/callback {
    limit_req zone=tencorp_auth_callback_per_ip burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/tencorp-auth-public-proxy.conf;
}

location = /__auth/telegram/bot-webhook {
    limit_req zone=tencorp_auth_webhook_per_ip burst=100 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/tencorp-auth-public-proxy.conf;
}

# Fixed, versioned UI assets are public and immutable. They use a dedicated
# proxy so the no-store policy for login/callback responses cannot overwrite
# their cache contract.
location ^~ /__auth/assets/ {
    limit_req zone=tencorp_auth_login_per_ip burst=120 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/tencorp-auth-assets-proxy.conf;
}

location ^~ /__auth/ {
    limit_req zone=tencorp_auth_general_per_ip burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/tencorp-auth-public-proxy.conf;
}

# Nginx-only session check. A client cannot request an `internal` location.
# The backend endpoint deliberately never redirects: 204 means authenticated;
# 401 means unauthenticated. No request body or caller Authorization header is
# sent to the gateway.
location = /__tencorp-auth/check {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:4340/internal/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_intercept_errors off;
    access_log off;
    error_log /dev/null emerg;
}

# A protected browser navigation receives the gateway's self-contained login
# page at its original URL. The immutable $request_uri is forwarded in a
# header, never interpolated into a redirect/query string. The gateway applies
# its own strict same-origin path validation before using it as return_to.
location @tencorp_auth_page_unauthorized {
    auth_request off;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($request_method != GET) { return 401 '{"error":"authentication_required"}\n'; }
    if ($http_accept !~* "text/html") { return 401 '{"error":"authentication_required"}\n'; }
    rewrite ^ /__tencorp-auth/login-page last;
}

# API, asset and data requests always receive a non-cacheable machine-readable
# 401. Routing through this named location also overrides any `public,
# immutable` cache header configured by the successful asset response.
location @tencorp_auth_api_unauthorized {
    auth_request off;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 401 '{"error":"authentication_required"}\n';
}

location = /__tencorp-auth/login-page {
    internal;
    auth_request off;
    limit_req zone=tencorp_auth_login_per_ip burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4340/__auth/login;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
    access_log off;
    error_log /dev/null emerg;
    add_header Cache-Control "private, no-store" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
}
