# Include inside API, JSON, framework-asset, image, font, and write locations
# at the public-gate cutover. The separately included server-level gate closes
# unclassified locations; this snippet selects a machine-readable 401 that
# never becomes login HTML or a redirect.
auth_request /__tencorp-auth/check;
error_page 401 = @tencorp_auth_api_unauthorized;
satisfy all;

# Strip spoofable identity headers. Consumers obtain the verified profile and
# phone number from GET /__auth/me instead of trusting a browser header.
# The edge-only session bearer and arbitrary browser Authorization value are
# stripped from every protected upstream, including external catalogue APIs.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Auth-User-ID "";
proxy_set_header X-Auth-Telegram-ID "";
proxy_set_header X-Auth-Phone "";

# Protected data/assets must be re-authorized after logout and never enter a
# shared cache, regardless of cache headers returned by an application.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Set-Cookie;
add_header Cache-Control "private, no-store" always;
add_header Pragma "no-cache" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
