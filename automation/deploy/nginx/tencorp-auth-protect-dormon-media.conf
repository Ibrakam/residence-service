# Only for the reviewed Do‘rmon photo location. Stored browser copies must
# always be revalidated through auth_request before reuse, including a 304.
auth_request /__tencorp-auth/check;
error_page 401 = @tencorp_auth_api_unauthorized;
satisfy all;

proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Auth-User-ID "";
proxy_set_header X-Auth-Telegram-ID "";
proxy_set_header X-Auth-Phone "";

proxy_cache off;
expires off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Set-Cookie;
add_header Cache-Control $tencorp_dormon_media_cache_policy always;
add_header Pragma "no-cache" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
