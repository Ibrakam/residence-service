# Include inside a browser/page location at the public-gate cutover. The
# separately included server-level gate closes unclassified locations; this
# snippet selects the friendly HTML login experience. POST, API-like fetches,
# and asset requests remain 401.
auth_request /__tencorp-auth/check;
error_page 401 = @tencorp_auth_page_unauthorized;
satisfy all;

# Never let a client-supplied identity header reach a proxied application.
# Applications that need identity must call the authenticated /__auth/me API;
# phone numbers are intentionally not propagated through Nginx headers.
# The shared session cookie and any browser Authorization value are consumed at
# the edge only and must never reach application logs or upstream services.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Auth-User-ID "";
proxy_set_header X-Auth-Telegram-ID "";
proxy_set_header X-Auth-Phone "";

# A protected response is never reusable after logout and must not enter a
# shared cache. Hide application cache metadata before adding the edge policy.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Set-Cookie;
add_header Cache-Control "private, no-store" always;
add_header Pragma "no-cache" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
