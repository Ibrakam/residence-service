# Shared body of an exact public /__auth/* location. Include only from the TLS
# server block after selecting that endpoint's rate-limit zone.
auth_request off;
proxy_pass http://127.0.0.1:4340;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Authorization "";
proxy_set_header X-Original-URI "";
proxy_set_header X-Auth-User-ID "";
proxy_set_header X-Auth-Telegram-ID "";
proxy_set_header X-Auth-Phone "";
proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;

# The Bot API webhook accepts Telegram Update JSON up to the gateway's 64 KiB
# parser limit. Other auth handlers enforce their own smaller method/body
# contracts (the OIDC start form is capped at 4 KiB by the gateway).
client_max_body_size 64k;
client_body_timeout 10s;
proxy_connect_timeout 2s;
proxy_send_timeout 15s;
# A cold OIDC callback can perform a token exchange and a lazy JWKS fetch,
# each with the gateway's 10-second upstream timeout. Keep Nginx outside that
# valid envelope while the gateway's own 30-second write timeout stays final.
proxy_read_timeout 30s;
proxy_request_buffering on;
proxy_buffering on;
proxy_intercept_errors off;
proxy_cookie_flags __Host-tencorp_session secure httponly samesite=lax;
proxy_cookie_flags __Host-tencorp_auth_binding secure httponly samesite=lax;

access_log off;
error_log /dev/null emerg;
add_header Cache-Control "private, no-store" always;
add_header Pragma "no-cache" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
