# Include once in nginx's http context, outside every server block. Do not
# apply these zones to /__tencorp-auth/check: each normal page request needs a
# check and throttling it would turn legitimate navigation into 500 responses.
# The login renderer has a larger burst than the state-changing start endpoint:
# one gated deploy deliberately verifies 35 site routes from the same host/IP.
# The start endpoint remains the tighter abuse boundary.
limit_req_zone $binary_remote_addr zone=tencorp_auth_login_per_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=tencorp_auth_start_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tencorp_auth_callback_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tencorp_auth_webhook_per_ip:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=tencorp_auth_general_per_ip:10m rate=60r/m;
