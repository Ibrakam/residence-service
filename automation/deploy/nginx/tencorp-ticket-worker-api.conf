# Include inside the TLS server block for form.tencorp.uz.
# The bearer and lease values are supplied by the worker. Never embed them here.

location = /__residence-ticket-worker {
    return 404;
}

location ^~ /__residence-ticket-worker/ {
    # The runner appends internal/ticket-runner/... to its public base URL.
    # A trailing slash here strips only the private public prefix.
    proxy_pass http://127.0.0.1:4330/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Ticket-Lease $http_x_ticket_lease;

    client_max_body_size 128k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    proxy_request_buffering on;
    proxy_buffering on;
    proxy_intercept_errors off;

    limit_except GET POST {
        deny all;
    }

    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
