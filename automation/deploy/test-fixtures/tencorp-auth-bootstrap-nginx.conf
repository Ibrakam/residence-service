worker_processes 1;
error_log stderr notice;
pid /tmp/tencorp-auth-bootstrap-nginx-test.pid;

events {
    worker_connections 32;
}

http {
    include /etc/nginx/snippets/tencorp-auth-rate-limits.conf;

    server {
        listen 8080;
        server_name form.tencorp.uz;

        # Bootstrap exposes OIDC without changing access to existing content.
        include /etc/nginx/snippets/tencorp-auth-gateway.conf;

        location = / {
            default_type text/plain;
            return 200 "open\n";
        }
    }
}
