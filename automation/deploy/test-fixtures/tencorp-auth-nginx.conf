worker_processes 1;
error_log stderr notice;
pid /tmp/tencorp-auth-nginx-test.pid;

events {
    worker_connections 32;
}

http {
    include /etc/nginx/snippets/tencorp-auth-rate-limits.conf;

    server {
        listen 8080;
        server_name form.tencorp.uz;

        include /etc/nginx/snippets/tencorp-auth-gateway.conf;
        include /etc/nginx/snippets/tencorp-auth-gate.conf;

        location = / {
            include /etc/nginx/snippets/tencorp-auth-protect-page.conf;
            proxy_pass http://127.0.0.1:4320;
        }

        location = /protected-api {
            include /etc/nginx/snippets/tencorp-auth-protect-api.conf;
            proxy_pass http://127.0.0.1:4320;
        }

        # A newly added location is closed even before it is classified as a
        # browser page or API. It inherits the server-level auth_request.
        location = /unclassified-content {
            proxy_pass http://127.0.0.1:4320;
        }

        location = /privacy {
            include /etc/nginx/snippets/tencorp-auth-exempt.conf;
            default_type text/plain;
            return 200 "privacy\n";
        }
    }
}
