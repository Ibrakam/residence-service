# Read-only JavaScript and challenge endpoints are public. Existing lead auth
# remains enforced by each original exact location before forwarding to guard.
location = /lead-security/client.js {
    include /etc/nginx/snippets/tencorp-auth-exempt.conf;
    alias /opt/tencorp-lead-guard/client.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /lead-security/challenge {
    auth_request off;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:4350;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}
location ^~ /lead-security/ { return 404; }
