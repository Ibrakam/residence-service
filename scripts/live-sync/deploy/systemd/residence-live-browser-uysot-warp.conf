# Install only as residence-live-browser-uysot.service.d/20-warp-proxy.conf
# after verifying WARP is registered in local-proxy mode on loopback port 40000.
[Unit]
Wants=warp-svc.service
After=warp-svc.service

[Service]
ExecStart=
ExecStart=/usr/bin/dbus-run-session -- /usr/bin/google-chrome-stable --user-data-dir=/home/residence-crm-browser/uysot-profile --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --remote-allow-origins=http://127.0.0.1:9223,http://localhost:9223 --no-first-run --disable-search-engine-choice-screen --disable-save-password-bubble --disable-session-crashed-bubble --disable-features=PasswordManagerOnboarding,PasswordLeakDetection --password-store=basic --lang=ru-RU --window-size=1440,900 --enable-unsafe-swiftshader --proxy-server=socks5://127.0.0.1:40000 --disable-quic https://app.uysot.uz/showroom/
